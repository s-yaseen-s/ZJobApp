<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DevTrack</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased flex flex-col">
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/90">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="landingPage.html" class="flex items-center space-x-3" aria-label="DevTrack home">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-teal-600 text-xl font-black text-white shadow-md">D</span>
        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Dev<span class="text-teal-600">Track</span></span>
      </a>
      <nav aria-label="Main navigation" class="flex items-center gap-4 text-sm font-semibold sm:gap-6">
        <a href="job-board.html" class="text-slate-600 transition hover:text-teal-600 dark:text-slate-300">Job Board</a>
        <a href="dashboard.html" class="text-slate-600 transition hover:text-teal-600 dark:text-slate-300">Dashboard</a>
        <a href="landingPage.html" class="rounded-lg bg-teal-600 px-4 py-2 text-white shadow-sm transition hover:bg-teal-700">Home</a>
      </nav>
    </div>
  </header>

  <main class="flex flex-1 items-center justify-center px-4 py-12 sm:px-6">
    <section class="w-full max-w-md">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-teal-600 text-2xl font-black text-white shadow-md">D</div>
        <p class="text-sm font-semibold uppercase tracking-widest text-teal-600">Welcome back</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Sign in to DevTrack</h1>
        <p class="mt-2 text-slate-600 dark:text-slate-400">Keep your job search organized in one place.</p>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-200/50 dark:border-slate-800 dark:bg-slate-900 dark:shadow-none sm:p-8">
        <div>
          <div class="space-y-5">
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required
                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
            </div>
            <div>
              <label for="password" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required
                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 dark:border-slate-700 dark:bg-slate-950 dark:text-white">
            </div>
            <div class="flex items-center justify-between gap-3 text-sm">
              <label class="flex items-center gap-2 text-slate-600 dark:text-slate-300">
                <input type="checkbox" name="remember" class="h-4 w-4 rounded border-slate-300 accent-teal-600">
                Remember me
              </label>
              <span class="text-slate-500 dark:text-slate-400">Demo only</span>
            </div>
            <button type="button" class="w-full rounded-lg bg-teal-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2 dark:focus:ring-offset-slate-900">
              Sign In
            </button>
          </div>
        </div>
        <p class="mt-5 rounded-lg bg-teal-50 px-4 py-3 text-center text-sm text-teal-900 dark:bg-teal-950/50 dark:text-teal-200">
          This is a visual mockup. Sign-in does not authenticate or create an account.
        </p>
      </div>

      <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
        <a href="landingPage.html" class="font-semibold text-teal-700 transition hover:text-teal-600 dark:text-teal-400">Back to the home page</a>
      </p>
    </section>
  </main>
</body>
</html>
