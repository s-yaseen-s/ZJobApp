<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTrack - Developer Job Application Tracker</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-xl shadow-md">
          D
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
          Dev<span class="text-teal-600">Track</span>
        </span>
      </a>

      <!-- Desktop Links -->
      <nav aria-label="Global" class="hidden md:flex items-center space-x-8 text-sm font-semibold text-slate-600 dark:text-slate-300">
        <a href="#features" class="hover:text-teal-600 transition">Features</a>
        <a href="#workflow" class="hover:text-teal-600 transition">Workflow</a>
        <a href="job-board.html" class="hover:text-teal-600 transition">Job Board</a>
        <a href="tracker.html" class="hover:text-teal-600 transition">Kanban Tracker</a>
      </nav>

      <!-- CTA Buttons -->
      <div class="hidden md:flex items-center space-x-4">
        <a href="login.html" class="text-sm font-semibold text-slate-700 dark:text-slate-200 hover:text-teal-600 px-3 py-2">
          Sign In
        </a>
        <a href="register.html" class="text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 px-4 py-2 rounded-lg shadow-sm transition">
          Get Started
        </a>
      </div>

      <!-- Pure HTML Mobile Menu -->
      <details class="md:hidden relative">
        <summary class="list-none cursor-pointer p-2 rounded-md border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300">
          <span class="sr-only">Open menu</span>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </summary>
        <div class="absolute right-0 top-12 w-56 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl p-4 space-y-3 z-50">
          <a href="dashboard.html" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Dashboard</a>
          <a href="job-board.html" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Job Board</a>
          <a href="tracker.html" class="block px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Kanban Board</a>
          <hr class="border-slate-200 dark:border-slate-800">
          <a href="login.html" class="block w-full text-center px-3 py-2 text-sm font-semibold text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-lg">Sign In</a>
          <a href="register.html" class="block w-full text-center px-3 py-2 text-sm font-semibold text-white bg-teal-600 rounded-lg">Get Started</a>
        </div>
      </details>

    </div>
  </header>

</body>
</html>
