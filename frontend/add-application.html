
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Application | DevTrack</title>
    <link href="./dist/output.css" rel="stylesheet">
    <script src="./src/theme.js" defer></script>
     <style>
    .application-container {
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
    }

    .application-actions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 32px;
    }

    @media (max-width: 600px) {
        .application-container {
            width: 94%;
            margin: 24px auto;
        }
    }
</style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white">

    <!-- Navigation -->
    <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
        <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-6 py-4" aria-label="Main navigation">
            <a href="index.html" class="text-2xl font-bold text-teal-600">
                DevTrack
            </a>

            <div class="flex flex-wrap items-center gap-5 text-sm font-medium">
                <a href="dashboard.html" class="hover:text-teal-600">Dashboard</a>
                <a href="job-board.html" class="hover:text-teal-600">Job Board</a>
                <a href="saved-jobs.html" class="hover:text-teal-600">Saved Jobs</a>
                <a href="tracker.html" class="text-teal-600">Tracker</a>
            </div>

            <button type="button" data-theme-toggle
                aria-label="Switch to dark mode"
                aria-pressed="false"
                class="rounded-lg border border-slate-300 px-3 py-2 text-sm dark:border-slate-700">
                Toggle theme
            </button>
        </nav>
       
    </header>

    <!-- Main Content -->
    <main class="application-container">

        <a href="tracker.html" class="text-sm font-medium text-teal-600 hover:underline">
            &larr; Back to Tracker
        </a>

        <h1 class="mt-5 text-3xl font-bold">
            Log New Job Application
        </h1>

        <p class="mt-2 text-slate-500 dark:text-slate-400">
            Keep track of your job applications and hiring progress.
        </p>

       
        <!-- Application Form -->
<form id="application-form"
      class="mt-8 rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

                <!-- Job Title -->
                <div>
                    <label for="job-title" class="mb-2 block font-semibold">
                        Job Title *
                    </label>
                    <input type="text" id="job-title" name="jobTitle"
                        placeholder="e.g. Frontend Engineer"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                </div>

                <!-- Company -->
                <div>
                    <label for="company" class="mb-2 block font-semibold">
                        Company Name *
                    </label>
                    <input type="text" id="company" name="company"
                        placeholder="e.g. Stripe"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                </div>

                <!-- Job URL -->
                <div>
                    <label for="job-url" class="mb-2 block font-semibold">
                        Job URL
                    </label>
                    <input type="url" id="job-url" name="jobUrl"
                        placeholder="https://example.com/job"
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                </div>

                <!-- Salary -->
                <div>
                    <label for="salary" class="mb-2 block font-semibold">
                        Salary Offer / Range
                    </label>
                    <input type="text" id="salary" name="salary"
                        placeholder="e.g. $100,000"
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                </div>

                <!-- Application Stage -->
                <div>
                    <label for="status" class="mb-2 block font-semibold">
                        Application Stage *
                    </label>
                    <select id="status" name="status" required
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                        <option value="applied">Applied</option>
                        <option value="screening">Screening</option>
                        <option value="interview">Interview</option>
                        <option value="offer">Offer</option>
                    </select>
                </div>

                <!-- Date -->
                <div>
                    <label for="date" class="mb-2 block font-semibold">
                        Date Applied *
                    </label>
                    <input type="date" id="date" name="dateApplied"
                        required
                        class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white">
                </div>

            </div>

            <!-- Notes -->
            <div class="mt-6">
                <label for="notes" class="mb-2 block font-semibold">
                    Notes & Technical Prep Details
                </label>
                <textarea id="notes" name="notes" rows="5"
                    placeholder="Recruiter contacts, referrals, or interview notes..."
                    class="w-full rounded-lg border border-slate-300 bg-white p-3 text-slate-900 dark:border-slate-600 dark:bg-slate-800 dark:text-white"></textarea>
            </div>

            <!-- Buttons -->
            <div class="application-actions">
                <a href="tracker.html"
                    class="rounded-lg border border-slate-300 px-6 py-3 font-semibold hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-800">
                    Cancel
                </a>

                <button type="submit"
                    class="rounded-lg bg-teal-600 px-6 py-3 font-semibold text-white hover:bg-teal-700">
                    Save Application
                </button>
            </div>

        </form>
    </main>


<script>
    const form = document.getElementById("application-form");
    const params = new URLSearchParams(window.location.search);
    const editId = params.get("id");

    const storageKey = "devtrackApplications";

    function getApplications() {
        try {
            const saved = JSON.parse(
                localStorage.getItem(storageKey) || "[]"
            );
            return Array.isArray(saved) ? saved : [];
        } catch (error) {
            console.error("Unable to read applications:", error);
            return [];
        }
    }

    // Load an existing application when editing
    if (editId !== null) {
        const applications = getApplications();

        const existingApplication = applications.find(function(app) {
            return String(app.id) === editId;
        });

        if (existingApplication) {
            document.getElementById("job-title").value =
                existingApplication.jobTitle || "";

            document.getElementById("company").value =
                existingApplication.company || "";

            document.getElementById("job-url").value =
                existingApplication.jobUrl || "";

            document.getElementById("salary").value =
                existingApplication.salary || "";

            document.getElementById("status").value =
                existingApplication.status || "applied";

            document.getElementById("date").value =
                existingApplication.dateApplied || "";

            document.getElementById("notes").value =
                existingApplication.notes || "";

            document.querySelector("h1").textContent =
                "Edit Job Application";

            document.querySelector('button[type="submit"]').textContent =
                "Update Application";
        } else {
            alert("Application not found.");
            window.location.href = "tracker.html";
        }
    }

    // Save a new application or update an existing one
    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const applications = getApplications();

        const application = {
            id: editId !== null ? editId : String(Date.now()),
            jobTitle: document.getElementById("job-title").value.trim(),
            company: document.getElementById("company").value.trim(),
            jobUrl: document.getElementById("job-url").value.trim(),
            salary: document.getElementById("salary").value.trim(),
            status: document.getElementById("status").value,
            dateApplied: document.getElementById("date").value,
            notes: document.getElementById("notes").value.trim()
        };

        if (editId !== null) {
            const index = applications.findIndex(function(app) {
                return String(app.id) === editId;
            });

            if (index === -1) {
                alert("Application not found. No changes were saved.");
                return;
            }

            applications[index] = application;
        } else {
            applications.push(application);
        }

        try {
            localStorage.setItem(
                storageKey,
                JSON.stringify(applications)
            );

            alert(
                editId !== null
                    ? "Application updated successfully!"
                    : "Application saved successfully!"
            );

            window.location.href = "tracker.html";
        } catch (error) {
            console.error("Unable to save application:", error);
            alert("Could not save the application. Please try again.");
        }
    });
</script>


</body>
</html>
